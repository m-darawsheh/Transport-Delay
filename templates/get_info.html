<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flight Information - Transport Delay Predictor</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
    <body>
    <div class="container">
        <div class="card">
            <div class="icon">
                <i class="fas fa-clipboard-list"></i>
            </div>
            <h1>Flight Information</h1>
            <h2>Enter your flight details for delay prediction</h2>
            
            <div class="form-container">
                <form action="/result" method="post" id="predictionForm">
                    <div class="form-group">
                        <label for="airline">
                            <i class="fas fa-plane" style="margin-right: 8px;"></i>
                            Airline
                        </label>
                        <select id="airline" name="airline" required>
                            <option value="" disabled selected>Select your airline</option>
                            <option value="AA">American Airlines (AA)</option>
                            <option value="AC">Air Canada (AC)</option>
                            <option value="AM">Aeromexico (AM)</option>
                            <option value="CO">Continental Airlines (CO)</option>
                            <option value="DL">Delta Airlines (DL)</option>
                            <option value="FX">FedEx (FX)</option>
                            <option value="HA">Hawaiian Airlines (HA)</option>
                            <option value="NW">Northwest Airlines (NW)</option>
                            <option value="PO">Polar Air Cargo (PO)</option>
                            <option value="SW">Southwest Airlines (SW)</option>
                            <option value="UA">United Airlines (UA)</option>
                            <option value="5X">United Parcel Service (5X)</option>
                            <option value="VS">Virgin Atlantic (VS)</option>
                            <option value="VB">VivaAerobús (VB)</option>
                            <option value="WS">WestJet (WS)</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="AirportFrom">
                                <i class="fas fa-plane-departure" style="margin-right: 8px;"></i>
                                Departure Airport
                            </label>
                            <select id="AirportFrom" name="AirportFrom" required>
                                <option value="" disabled selected>Select departure airport</option>
                                <option value="ATL">ATL - Atlanta</option>
                                <option value="AUS">AUS - Austin</option>
                                <option value="BNA">BNA - Nashville</option>
                                <option value="BOS">BOS - Boston</option>
                                <option value="BWI">BWI - Baltimore</option>
                                <option value="CLT">CLT - Charlotte</option>
                                <option value="DAL">DAL - Dallas Love Field</option>
                                <option value="DCA">DCA - Washington National</option>
                                <option value="DEN">DEN - Denver</option>
                                <option value="DFW">DFW - Dallas/Fort Worth</option>
                                <option value="DTW">DTW - Detroit</option>
                                <option value="EWR">EWR - Newark</option>
                                <option value="FLL">FLL - Fort Lauderdale</option>
                                <option value="HNL">HNL - Honolulu</option>
                                <option value="HOU">HOU - Houston Hobby</option>
                                <option value="IAD">IAD - Washington Dulles</option>
                                <option value="IAH">IAH - Houston Bush</option>
                                <option value="JFK">JFK - New York JFK</option>
                                <option value="LAS">LAS - Las Vegas</option>
                                <option value="LAX">LAX - Los Angeles</option>
                                <option value="LGA">LGA - New York LaGuardia</option>
                                <option value="MCO">MCO - Orlando</option>
                                <option value="MDW">MDW - Chicago Midway</option>
                                <option value="MIA">MIA - Miami</option>
                                <option value="MSP">MSP - Minneapolis</option>
                                <option value="MSY">MSY - New Orleans</option>
                                <option value="OAK">OAK - Oakland</option>
                                <option value="ORD">ORD - Chicago O'Hare</option>
                                <option value="PDX">PDX - Portland</option>
                                <option value="PHL">PHL - Philadelphia</option>
                                <option value="PHX">PHX - Phoenix</option>
                                <option value="RDU">RDU - Raleigh-Durham</option>
                                <option value="SAN">SAN - San Diego</option>
                                <option value="SEA">SEA - Seattle</option>
                                <option value="SFO">SFO - San Francisco</option>
                                <option value="SJC">SJC - San Jose</option>
                                <option value="SLC">SLC - Salt Lake City</option>
                                <option value="SMF">SMF - Sacramento</option>
                                <option value="STL">STL - St. Louis</option>
                                <option value="TPA">TPA - Tampa</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="AirportTo">
                                <i class="fas fa-plane-arrival" style="margin-right: 8px;"></i>
                                Arrival Airport
                            </label>
                            <select id="AirportTo" name="AirportTo" required>
                                <option value="" disabled selected>Select arrival airport</option>
                                <option value="ATL">ATL - Atlanta</option>
                                <option value="AUS">AUS - Austin</option>
                                <option value="BNA">BNA - Nashville</option>
                                <option value="BOS">BOS - Boston</option>
                                <option value="BWI">BWI - Baltimore</option>
                                <option value="CLT">CLT - Charlotte</option>
                                <option value="DAL">DAL - Dallas Love Field</option>
                                <option value="DCA">DCA - Washington National</option>
                                <option value="DEN">DEN - Denver</option>
                                <option value="DFW">DFW - Dallas/Fort Worth</option>
                                <option value="DTW">DTW - Detroit</option>
                                <option value="EWR">EWR - Newark</option>
                                <option value="FLL">FLL - Fort Lauderdale</option>
                                <option value="HNL">HNL - Honolulu</option>
                                <option value="HOU">HOU - Houston Hobby</option>
                                <option value="IAD">IAD - Washington Dulles</option>
                                <option value="IAH">IAH - Houston Bush</option>
                                <option value="JFK">JFK - New York JFK</option>
                                <option value="LAS">LAS - Las Vegas</option>
                                <option value="LAX">LAX - Los Angeles</option>
                                <option value="LGA">LGA - New York LaGuardia</option>
                                <option value="MCO">MCO - Orlando</option>
                                <option value="MDW">MDW - Chicago Midway</option>
                                <option value="MIA">MIA - Miami</option>
                                <option value="MSP">MSP - Minneapolis</option>
                                <option value="MSY">MSY - New Orleans</option>
                                <option value="OAK">OAK - Oakland</option>
                                <option value="ORD">ORD - Chicago O'Hare</option>
                                <option value="PDX">PDX - Portland</option>
                                <option value="PHL">PHL - Philadelphia</option>
                                <option value="PHX">PHX - Phoenix</option>
                                <option value="RDU">RDU - Raleigh-Durham</option>
                                <option value="SAN">SAN - San Diego</option>
                                <option value="SEA">SEA - Seattle</option>
                                <option value="SFO">SFO - San Francisco</option>
                                <option value="SJC">SJC - San Jose</option>
                                <option value="SLC">SLC - Salt Lake City</option>
                                <option value="SMF">SMF - Sacramento</option>
                                <option value="STL">STL - St. Louis</option>
                                <option value="TPA">TPA - Tampa</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="day">
                                <i class="fas fa-calendar-day" style="margin-right: 8px;"></i>
                                Day of Week
                            </label>
                            <select id="day" name="day" required>
                                <option value="" disabled selected>Select day</option>
                                <option value="1">Monday</option>
                                <option value="2">Tuesday</option>
                                <option value="3">Wednesday</option>
                                <option value="4">Thursday</option>
                                <option value="5">Friday</option>
                                <option value="6">Saturday</option>  
                                <option value="7">Sunday</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="time">
                                <i class="fas fa-clock" style="margin-right: 8px;"></i>
                                Departure Time (24-hour format)
                            </label>
                            <input type="number" id="time" name="time" required placeholder="e.g., 14 for 2:00 PM" min="0" max="23">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="Length">
                            <i class="fas fa-route" style="margin-right: 8px;"></i>
                            Flight Duration (minutes)
                        </label>
                        <input type="number" id="Length" name="Length" required placeholder="e.g., 120 for 2 hours" min="30" max="1440">
                    </div>

                    <button type="submit" class="btn">
                        <i class="fas fa-magic" style="margin-right: 10px;"></i>
                        Predict Delay
                    </button>
                    
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p>Analyzing flight data...</p>
                    </div>
                </form>
                
                <button class="btn btn-secondary" onclick="window.location.href='/'">
                    <i class="fas fa-arrow-left" style="margin-right: 10px;"></i>
                    Back to Home
                </button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', function() {
            document.getElementById('loading').style.display = 'block';
        });
        
        // Auto-populate time with current hour
        const now = new Date();
        const currentHour = now.getHours();
        document.getElementById('time').value = currentHour;
    </script>
</body>
</html>
